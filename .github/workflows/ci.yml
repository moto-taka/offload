name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['26.0.0', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
  skills-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install the actual skill with the skills.sh CLI
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/offload-skills-install"
          cd "$RUNNER_TEMP/offload-skills-install"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill offload --agent codex --copy --yes
          test -f .agents/skills/offload/SKILL.md
          node .agents/skills/offload/scripts/offload.mjs doctor
          node .agents/skills/offload/scripts/offload.mjs validate \
            --plan .agents/skills/offload/examples/work-plan.example.json \
            --recipe .agents/skills/offload/examples/environment-recipe.example.json
